[project]
name = "collective-intelligence"
version = "0.1.0"
description = "A lightweight autonomous AI entity harness."
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = [
    "anthropic>=0.96.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-frontmatter>=1.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "markdown>=3.10.2",
]

[project.scripts]
ci = "harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
